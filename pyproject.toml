[project]
name = "video-pipeline"
version = "0.1.0"
description = "A video processing service with search by description."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.1,<20",
    "fastapi>=0.156.0",
    "ffpyplayer>=4.5.3,<5",
    "filelock>=4.2.4",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "procrastinate==3.10.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0,<7",
    "textual>=8.2.8",
    "torch>=2.14.1,<3",
    "torchvision>=0.29.1,<0.30",  # Used by Gemma's Transformers image processor.
    "tqdm>=4.67,<5",
    "transformers>=5.20.2,<6",
    "uvicorn>=0.54.0",
]

[project.scripts]
reelcall = "video_pipeline.cli:main"
video-pipeline = "video_pipeline.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src/video_pipeline",
    "/pyproject.toml",
    "/uv.lock",
    "/README.md",
    "/Dockerfile",
    "/compose.yaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/video_pipeline"]

[tool.hatch.build.targets.wheel.force-include]
"compose.yaml" = "video_pipeline/_service/compose.yaml"
"Dockerfile" = "video_pipeline/_service/Dockerfile"
"pyproject.toml" = "video_pipeline/_service/pyproject.toml"
"uv.lock" = "video_pipeline/_service/uv.lock"
"README.md" = "video_pipeline/_service/README.md"

[dependency-groups]
dev = [
    "ruff>=0.12",
    "ty>=0.0.1",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
