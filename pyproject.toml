[project]
name = "video-pipeline"
version = "0.1.0"
description = "A video processing service with search by description."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.1,<20",
    "fastapi>=0.156.0",
    "filelock>=4.2.4",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "procrastinate==3.10.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0,<7",
    "torch>=2.14.1,<3",
    "torchvision>=0.29.1,<0.30",  # Used by Gemma's Transformers image processor.
    "transformers>=5.20.2,<6",
    "uvicorn>=0.54.0",
]

[project.scripts]
video-pipeline = "video_pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.12",
    "ty>=0.0.1",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
