[project]
name = "video-pipeline"
version = "0.1.0"
description = "A video processing service with search by description."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
video-pipeline = "video_pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.12",
    "ty>=0.0.1",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
